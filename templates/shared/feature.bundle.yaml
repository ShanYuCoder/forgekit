schema: portal-feature-bundle/v1
page-id: role-domain-function
title: Feature title
status: draft
owner: portal-team
summary: |
  - mục tiêu nghiệp vụ (business_goals): [Nêu rõ vấn đề đang giải quyết và giá trị kinh tế/nghiệp vụ mang lại. Viết sâu sắc để Stakeholder hiểu rõ vì sao phải làm.]
  - các bên liên quan (stakeholders): [Ai dùng, ai hưởng lợi, ai quản lý?]
  - kịch bản người dùng (user_journey): [Kể câu chuyện người dùng trải qua các bước trên màn hình bằng ngôn ngữ đời thường.]
  - bối cảnh (context):
    - description: [Phân tích sâu luồng nghiệp vụ chi tiết]
    - input: [Dữ liệu đầu vào. CHÚ Ý liên kết cross-page / cross-module nếu có]
    - output: [Kết quả đầu ra]
  - cách giải quyết (solution): [Tuỳ chọn. Ghi kỹ thuật phức tạp nếu có.]

